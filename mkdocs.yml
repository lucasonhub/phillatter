site_name: Mente Semanal
site_description: Pesquisa sobre mente, cognição e inteligência
site_url: !ENV [SITE_URL, 'http://127.0.0.1:8000/']
use_directory_urls: true
theme:
  name: material
  language: pt
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: [pt, en]
hooks:
  - scripts/site_hook.py
nav:
  - Início: index.md
  - Edições: editions/index.md
  - Temas: categories.md
  - RSS: feed.xml
extra_css:
  - stylesheets/newsletter.css
extra_javascript:
  - javascripts/filter.js
